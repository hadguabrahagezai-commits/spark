<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jarvis Dashboard</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; background:#0b0f14; color:#e6eef8; margin:0; }
      .container{max-width:1100px;margin:24px auto;padding:20px}
      .panel{background:#0f1720;padding:14px;border-radius:10px;margin-bottom:12px}
      pre{white-space:pre-wrap;overflow:auto}
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Jarvis Dashboard</h1>
      <div class="panel">
        <h3>Live Logs</h3>
        <pre id="logs">loading…</pre>
      </div>
      <div class="panel">
        <h3>Tasks</h3>
        <pre id="tasks">loading…</pre>
      </div>
      <div class="panel">
        <h3>Metrics</h3>
        <pre id="metrics">loading…</pre>
      </div>
    </div>
    <script>
      async function load(){
        const [logs, tasks, metrics] = await Promise.all([
          fetch('/api/logs/engine').then(r=>r.text()).catch(()=>''),
          fetch('/api/tasks').then(r=>r.json()).catch(()=>({})),
          fetch('/api/metrics').then(r=>r.json()).catch(()=>({})),
        ]);
        document.getElementById('logs').textContent = logs;
        document.getElementById('tasks').textContent = JSON.stringify(tasks, null, 2);
        document.getElementById('metrics').textContent = JSON.stringify(metrics, null, 2);
      }
      load(); setInterval(load, 3000);
    </script>
  </body>
</html>
